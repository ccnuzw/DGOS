<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DGOS AI Workbench</title><link rel="stylesheet" href="./tokens.css?launchTicket=__DGOS_LAUNCH_TICKET__"><link rel="stylesheet" href="./workbench.css?launchTicket=__DGOS_LAUNCH_TICKET__"></head><body>
<main><header><h1 data-i18n="title">AI Workbench</h1><span id="status" role="status" aria-live="polite">Connecting</span></header><form id="task"><label for="model" data-i18n="model">Model</label><select name="model" id="model" required><option value="">Loading models</option></select><div id="parameters" hidden></div><label for="prompt" data-i18n="prompt">Prompt</label><textarea name="prompt" id="prompt" required maxlength="4000"></textarea><div class="form-actions"><button id="submit" type="button" data-i18n="run">Run task</button><button id="retry-submit" type="button" hidden data-i18n="retrySubmit">Retry submission</button></div></form><section aria-labelledby="task-title"><div class="section-title"><h2 id="task-title" data-i18n="task">Task</h2><div class="task-actions"><button id="cancel" type="button" disabled data-i18n="cancel">Cancel</button><button id="refresh" type="button" disabled data-i18n="refresh">Refresh</button></div></div><div class="resume"><label for="task-id" data-i18n="taskId">Task ID</label><input id="task-id" type="text" autocomplete="off"><button id="resume" type="button" data-i18n="resume">Resume</button></div><output id="result" aria-live="polite">No task yet.</output><div id="artifacts"></div></section></main>
<script src="./workbench.js?launchTicket=__DGOS_LAUNCH_TICKET__" defer></script></body></html>
