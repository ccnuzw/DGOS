[package]
name = "dgos-desktop"
version = "0.1.0"
description = "DGOS V1 minimal Tauri 2 macOS host"
authors = ["DGOS"]
edition = "2021"
rust-version = "1.77"
default-run = "dgos-desktop"

[lib]
name = "dgos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
url = "2"
security-framework = "3"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
