[package]
name = "dgos-desktop"
version = "0.1.0"
description = "DGOS V1 minimal Tauri 2 macOS host"
authors = ["DGOS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dgos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
