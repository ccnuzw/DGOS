<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State: No Providers -->

  <!-- Background elements -->
  <rect x="50" y="30" width="100" height="70" rx="8" stroke="#e2e8f0" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Disconnected nodes -->
  <circle cx="70" cy="50" r="6" stroke="#0F5FD9" stroke-width="2" fill="none"/>
  <circle cx="100" cy="50" r="6" stroke="#0F5FD9" stroke-width="2" fill="none"/>
  <circle cx="130" cy="50" r="6" stroke="#0F5FD9" stroke-width="2" fill="none"/>

  <!-- Dashed connection lines (disconnected) -->
  <line x1="76" y1="50" x2="94" y2="50" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="106" y1="50" x2="124" y2="50" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Plus icon (call to action) -->
  <circle cx="100" cy="85" r="12" fill="#0F5FD9" opacity="0.1"/>
  <line x1="100" y1="79" x2="100" y2="91" stroke="#0F5FD9" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="85" x2="106" y2="85" stroke="#0F5FD9" stroke-width="2" stroke-linecap="round"/>
</svg>
