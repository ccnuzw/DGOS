<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-dgos-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5FD9"/>
      <stop offset="30%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0F5FD9"/>
    </linearGradient>
    <filter id="shadow-dgos">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-dgos">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main rounded square with premium gradient -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#grad-dgos-logo)" filter="url(#shadow-dgos)"/>
  <!-- Premium highlight -->
  <path d="M 4 14 Q 4 4 14 4 L 34 4 Q 44 4 44 14 L 44 18 Q 24 8 4 18 Z" fill="white" opacity="0.4"/>
  <!-- DGOS Letter mark - stylized D -->
  <path d="M 14 16 L 22 16 C 28 16 32 20 32 24 C 32 28 28 32 22 32 L 14 32 Z M 18 20 L 18 28 L 22 28 C 25 28 28 26 28 24 C 28 22 25 20 22 20 Z" fill="white" opacity="0.95" filter="url(#glow-dgos)"/>
  <!-- Abstract geometric elements -->
  <circle cx="30" cy="18" r="2" fill="white" opacity="0.8"/>
  <rect x="32" y="28" width="4" height="4" rx="1" fill="white" opacity="0.7"/>
</svg>
