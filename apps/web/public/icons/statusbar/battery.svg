<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Battery outline -->
  <rect x="4" y="8" width="14" height="8" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Battery terminal -->
  <line x1="18" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="13" x2="20" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Battery fill level (full) -->
  <rect x="6" y="10" width="10" height="4" rx="1" fill="currentColor"/>
</svg>
