<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock face -->
  <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Hour hand -->
  <line x1="12" y1="12" x2="12" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="12" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="1" fill="currentColor"/>
</svg>
