openapi: 3.0.3
info:
  title: DGOS V1 Logical API
  version: "1.0.0"
  description: |
    DGOS V1 逻辑契约的 HTTPS JSON + SSE 投影。桌面 IPC 必须保持相同的动作、字段、权限和事件语义。
    该文件同时登记已实现的本地 contract projection 与尚未具备真实桌面/Web E2E 证据的 draft operation。
security:
  - dgosSession: []
  - dgosApiKey: []
servers:
  - url: https://localhost
    description: Docker Compose Web projection (planned)
tags:
  - name: system
  - name: providers
  - name: ai-tasks
  - name: skills
  - name: mcp
  - name: assistant
  - name: identity
  - name: secrets
  - name: governance
  - name: usage
  - name: apps
paths:
  /api/v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Public app catalog }
    post:
      tags: [apps]
      operationId: submitAppManifest
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '201': { description: Manifest accepted for review }
  /api/v1/apps/{appId}/install:
    post:
      tags: [apps]
      operationId: installApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Installed app snapshot }
  /api/v1/apps/{appId}/launch:
    post:
      tags: [apps]
      operationId: launchApp
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Active app snapshot }
  /api/v1/apps/{appId}/update:
    post:
      tags: [apps]
      operationId: updateApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Updated app snapshot }
  /api/v1/apps/{appId}/uninstall:
    post:
      tags: [apps]
      operationId: uninstallApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Uninstalled app snapshot with retained data }
  /api/v1/apps/{appId}/health:
    get:
      tags: [apps]
      operationId: checkAppHealth
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200': { description: Health snapshot }
  /api/v1/actions:
    get:
      tags: [assistant]
      operationId: listActions
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Actions visible to the current subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionList' }
  /api/v1/system/settings:
    get:
      tags: [system]
      operationId: readSystemSettings
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Current system settings and effective values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettingsSnapshot' }
    patch:
      tags: [system]
      operationId: writeSystemSettings
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettingsPatch' }
      responses:
        '200':
          description: Updated settings and restart status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettingsSnapshot' }
        '409':
          description: Settings version conflict
  /api/v1/system/context:
    get:
      tags: [system]
      operationId: readSystemContext
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Redacted runtime context for the current application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemContextSnapshot' }
  /api/v1/system/context/events:
    get:
      tags: [system]
      operationId: subscribeSystemContext
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Server-sent system context changes
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/permissions/check:
    post:
      tags: [system]
      operationId: checkPermission
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCheckRequest' }
      responses:
        '200':
          description: Effective permission decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDecisionResult' }
  /api/v1/permissions/request:
    post:
      tags: [system]
      operationId: requestPermission
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
      responses:
        '202':
          description: User confirmation request created; no side effect has occurred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDecisionResult' }
  /api/v1/actions/{actionId}/plan:
    post:
      tags: [assistant]
      operationId: planAction
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionPlanRequest' }
      responses:
        '200':
          description: Action plan and confirmation requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPlan' }
  /api/v1/actions/{actionId}/execute:
    post:
      tags: [assistant]
      operationId: executeAction
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionExecuteRequest' }
      responses:
        '202':
          description: Action execution accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
  /api/v1/action-runs/{runId}:
    get:
      tags: [assistant]
      operationId: getActionRun
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionRunId' }
      responses:
        '200':
          description: Action run snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
    delete:
      tags: [assistant]
      operationId: cancelActionRun
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionRunId' }
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
  /api/v1/provider/protocols:
    get:
      tags: [providers]
      operationId: listProviderProtocols
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Registered protocol adapters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProtocolAdapterRegistration' }
  /api/v1/provider/configs/{providerId}/capabilities:
    get:
      tags: [providers]
      operationId: listProviderCapabilities
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '200':
          description: Versioned capability descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCapabilityDescriptor' }
  /api/v1/provider/capability-protocols:
    get:
      tags: [providers]
      operationId: listCapabilityProtocols
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Registered declarative capability protocols
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
    post:
      tags: [providers]
      operationId: validateCapabilityProtocol
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
      responses:
        '200':
          description: Canonical validated protocol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
        '422':
          description: Protocol schema or safety validation failed
  /api/v1/provider/configs:
    get:
      tags: [providers]
      operationId: listProviderConfigs
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Redacted provider configurations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderConfig' }
    post:
      tags: [providers]
      operationId: createProviderConfig
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderConfigInput' }
      responses:
        '201':
          description: Created redacted configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConfig' }
  /api/v1/provider/configs/{providerId}/validate:
    post:
      tags: [providers]
      operationId: validateProviderConfig
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEnvelope' }
      responses:
        '200':
          description: Protocol validation and redacted capability descriptor; failed validation atomically disables the provider for new tasks while retaining secret references and diagnostic catalog/policy history. Model catalog is refreshed by the separate models endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderValidationResult' }
  /api/v1/provider/configs/{providerId}:
    put:
      tags: [providers]
      operationId: updateProviderConfig
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderConfigUpdate' }
      responses:
        '200':
          description: Updated redacted provider configuration. The updated configuration must pass validation before it can serve new tasks; validation failure disables the provider and retains secret references and diagnostic catalog/policy history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConfig' }
    delete:
      tags: [providers]
      operationId: deleteProviderConfig
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '204':
          description: Provider configuration and its secret reference removed; model catalog history may remain as non-selectable history
  /api/v1/provider/configs/{providerId}/models:
    get:
      tags: [providers]
      operationId: listProviderModels
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '200':
          description: Provider model catalog and local capability policy
          content:
            application/json:
              schema:
                type: object
                required: [items, refreshedAt]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModelCatalogEntry' }
                  refreshedAt: { type: string, format: date-time }
    post:
      tags: [providers]
      operationId: refreshProviderModels
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEnvelope' }
      responses:
        '202':
          description: Model refresh accepted
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status]
                properties:
                  requestId: { type: string }
                  status: { type: string, enum: [queued, running, completed, failed] }
  /api/v1/provider/configs/{providerId}/model-policies:
    get:
      tags: [providers]
      operationId: listProviderModelPolicies
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '200':
          description: User editable model activation and capability policy
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModelCapabilityPolicy' }
    post:
      tags: [providers]
      operationId: updateProviderModelPolicy
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelCapabilityPolicyUpdate' }
      responses:
        '200':
          description: Updated model policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCapabilityPolicy' }
  /api/v1/ai-tasks:
    post:
      tags: [ai-tasks]
      operationId: submitAiTask
      x-tag-feature: V1-FR-005
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AITaskSubmitRequest' }
      responses:
        '202':
          description: Accepted idempotent task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AITaskReceipt' }
  /api/v1/ai-tasks/{taskId}:
    get:
      tags: [ai-tasks]
      operationId: getAiTask
      x-tag-feature: V1-FR-005
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Authoritative task snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AITaskSnapshot' }
    delete:
      tags: [ai-tasks]
      operationId: cancelAiTask
      x-tag-feature: V1-FR-005
      x-tag-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Cancellation request or terminal task snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AITaskSnapshot' }
  /api/v1/ai-tasks/{taskId}/events:
    get:
      tags: [ai-tasks]
      operationId: streamAiTaskEvents
      x-tag-feature: V1-FR-005
      x-tag-implementation-status: planned
      description: SSE stream. Last-Event-ID or cursor resumes after a disconnect.
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Sanitized task events
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames carrying AITaskEvent JSON data
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [ai-tasks]
      operationId: readArtifact
      x-tag-feature: V1-FR-005
      x-tag-implementation-status: implemented
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sanitized task artifact content
          content:
            application/json:
              schema:
                type: object
                required: [artifactId, mimeType, content]
                properties:
                  artifactId: { type: string }
                  mimeType: { type: string }
                  content: { type: string }
  /api/v1/skills:
    get:
      tags: [skills]
      operationId: listSkills
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Skill registry entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionList' }
    post:
      tags: [skills]
      operationId: installSkill
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionInstallRequest' }
      responses:
        '202':
          description: Skill installation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/skills/{skillId}/state:
    post:
      tags: [skills]
      operationId: setSkillState
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/SkillId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionStateRequest' }
      responses:
        '200':
          description: Updated skill state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/skills/{skillId}:
    delete:
      tags: [skills]
      operationId: uninstallSkill
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/SkillId' }
      responses:
        '202':
          description: Skill uninstall accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/mcp:
    get:
      tags: [mcp]
      operationId: listMcpServices
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      responses:
        '200':
          description: MCP registry entries without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionList' }
    post:
      tags: [mcp]
      operationId: installMcp
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionInstallRequest' }
      responses:
        '202':
          description: MCP installation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/mcp/{mcpId}/state:
    post:
      tags: [mcp]
      operationId: setMcpState
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/McpId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionStateRequest' }
      responses:
        '200':
          description: Updated MCP state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/mcp/{mcpId}:
    delete:
      tags: [mcp]
      operationId: uninstallMcp
      x-tag-feature: V1-FR-003
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/McpId' }
      responses:
        '202':
          description: MCP uninstall accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionRecord' }
  /api/v1/identity/admin/bootstrap:
    post:
      tags: [identity]
      operationId: bootstrapAdmin
      security: []
      x-tag-feature: V1-FR-010
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBootstrapRequest' }
      responses:
        '201':
          description: First administrator created and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionReceipt' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/identity/admin/login:
    post:
      tags: [identity]
      operationId: adminLogin
      security: []
      x-tag-feature: V1-FR-010
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200':
          description: Authenticated administrator session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/identity/admin/session:
    get:
      tags: [identity]
      operationId: getAdminSession
      x-tag-feature: V1-FR-010
      x-tag-implementation-status: planned
      security:
        - dgosSession: []
      responses:
        '200':
          description: Current administrator session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [identity]
      operationId: renewAdminSession
      x-tag-feature: V1-FR-010
      x-tag-implementation-status: planned
      security:
        - dgosSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRenewRequest' }
      responses:
        '200':
          description: Renewed administrator session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/identity/admin/sessions/{sessionId}:
    delete:
      tags: [identity]
      operationId: revokeAdminSession
      x-tag-feature: V1-FR-010
      x-tag-implementation-status: planned
      security:
        - dgosSession: []
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEnvelope' }
      responses:
        '200':
          description: Revoked administrator session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/secret/api-keys:
    get:
      tags: [secrets]
      operationId: listApiKeys
      x-tag-feature: V1-FR-011
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Redacted API key metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [secrets]
      operationId: createApiKey
      x-tag-feature: V1-FR-011
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
      responses:
        '201':
          description: API key metadata and one-time secret
          content:
            application/json:
