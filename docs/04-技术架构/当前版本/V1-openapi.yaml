components:
  requestBodies:
    AppReleaseMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppReleaseMutation' }
    AppMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppMutation' }
  securitySchemes:
    appLaunchTicket:
      type: apiKey
      in: query
      name: launchTicket
      description: Opaque short-lived session/subject/app/package/instance-bound static ticket, redacted from logs; no bridge authority.
    dgosSession:
      type: apiKey
      in: cookie
      name: dgos_session
      description: Revocable DGOS administrator or subject session cookie.
    dgosApiKey:
      type: http
      scheme: bearer
      bearerFormat: DGOS-API-Key
      description: DGOS API Key; the secret is never returned after creation.
  responses:
    ConfirmationRequired:
      description: confirmation_required; ticket missing, expired, consumed by another intent or mismatched. No protected mutation; fresh authentication failures use 403 step_up_required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AppPackage:
      description: Verified package metadata with platform-computed trust and catalog state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppPackageRecord' }
    AppInstall:
      description: Authorized install snapshot; no host filesystem path is exposed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppInstallRecord' }
    Unauthorized:
      description: Authentication missing, expired, or revoked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Subject lacks the required capability or scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found within the caller's authorized scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency, version, reservation, or resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Request failed schema or domain validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Authentication or operation rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaExceeded:
      description: Hard quota prevents the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Required service is unavailable; no protected side effect was committed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  parameters:
    AppId: { in: path, name: appId, required: true, schema: { type: string } }
    ProviderId: { in: path, name: providerId, required: true, schema: { type: string } }
    TaskId: { in: path, name: taskId, required: true, schema: { type: string } }
    SkillId: { in: path, name: skillId, required: true, schema: { type: string } }
    McpId: { in: path, name: mcpId, required: true, schema: { type: string } }
    ActionId: { in: path, name: actionId, required: true, schema: { type: string } }
    ActionRunId: { in: path, name: runId, required: true, schema: { type: string } }
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string } }
    KeyId: { in: path, name: keyId, required: true, schema: { type: string } }
    AccountId: { in: path, name: accountId, required: true, schema: { type: string } }
    TestId: { in: path, name: testId, required: true, schema: { type: string } }
    JobId: { in: path, name: jobId, required: true, schema: { type: string } }
    ReservationId: { in: path, name: reservationId, required: true, schema: { type: string } }
  schemas:
    ManualProxyProvisionRequest:
      type: object
      additionalProperties: false
      required: [requestId, displayName, endpoint]
      properties:
        requestId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 128, description: Non-secret human label; trimmed, reject control characters and credential/URL-like content, never derive it from endpoint or username }
        endpoint: { type: string, format: uri, minLength: 1, maxLength: 2048, writeOnly: true, description: HTTPS proxy origin only, optional root slash; no userinfo/query/fragment/non-root path/control characters. Host/port/CIDR and TLS policy comes from deployment, not this input. HTTP accepted only by explicit isolated local test policy, never enabled by request body. }
        username: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: Optional Basic authentication pair; reject colon and control characters. Username and password must both be supplied or both omitted. Combined UTF-8 username:password at most 384 bytes and base64 at most 512 characters. }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: Paired write-only proxy password; reject control characters, preserve other bytes, never trim/coerce/log/echo. Not a DGOS account credential. }
      oneOf:
        - required: [username, password]
        - not:
            anyOf:
              - required: [username]
              - required: [password]
    ManualProxyProvisionReceipt:
      type: object
      additionalProperties: false
      required: [requestId, manualProxyRef, displayName, status, credentialStatus]
      properties:
        requestId: { type: string, format: uuid }
        manualProxyRef: { type: string, pattern: '^proxy_[A-Za-z0-9_-]{32,128}$', description: Server-generated immutable-purpose reference, not a bearer capability; accepted only through authorized network settings and runtime Secret boundary }
        displayName: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [stored], description: Receipt of durable Secret provisioning only; not connected, validated upstream, active or current readiness }
        credentialStatus: { type: string, enum: [not_required, configured], description: Authentication material storage state at commit, not verification of proxy authentication }
    AppDeployment:
      type: object
      additionalProperties: false
      required: [appId, state, versionNumber, dataRetained, activeRelease]
      properties:
        appId: { type: string }
        state: { type: string, enum: [installed, active, update_pending, health_check_failed, rolled_back, uninstall_requested, uninstalled] }
        versionNumber: { type: integer, minimum: 1, description: Deployment revision used as update/uninstall baseVersion; never catalog reviewVersion or package build }
        dataRetained: { type: boolean }
        activeRelease:
          type: object
          nullable: true
          required: [version, build, releaseChannel, digest, dataVersion]
          properties:
            version: { type: string }
            build: { type: integer, minimum: 0 }
            releaseChannel: { type: string, enum: [stable, beta, dev] }
            digest: { type: string }
            dataVersion: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    AppLaunchReceipt:
      type: object
      required: [appId, instanceId, bridgeVersion, entrypoint, isolation, declaredCapabilities, expiresAt]
      properties:
        appId: { type: string }
        instanceId: { type: string, format: uuid }
        bridgeVersion: { type: integer, enum: [1] }
        entrypoint: { type: string, description: Controlled relative resource route; optional launchTicket is sensitive, do not log or persist }
        isolation: { type: string, enum: [opaque-origin-sandbox] }
        declaredCapabilities: { type: array, uniqueItems: true, items: { type: string }, description: Declared ceiling only, not runtime grants }
        expiresAt: { type: string, format: date-time }
        digest: { type: string }
    AppCapabilityRequest:
      type: object
      additionalProperties: false
      required: [instanceId, requestId, capability, input]
      properties:
        instanceId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        capability: { type: string, enum: [dgos.model.list, dgos.model.resolve, dgos.aiTask.submit, dgos.aiTask.get, dgos.aiTask.events, dgos.aiTask.cancel, dgos.artifact.read, dgos.system.context.read, dgos.system.context.events] }
        input: { type: object, description: Strict selected capability schema; no caller owner/session/app or transport URL/handler }
      x-dgos-call-schema: 'V1-app-bridge.schema.json#/$defs/call'
      x-dgos-capability-mapping:
        dgos.model.list: { scopes: [provider.model.read], response: ModelSelectionList }
        dgos.model.resolve: { scopes: [provider.model.read], response: ModelResolution }
        dgos.aiTask.submit: { scopes: [ai_task.submit], operationId: submitAiTask, response: AITaskReceipt }
        dgos.aiTask.get: { scopes: [ai_task.read], operationId: getAiTask, response: AITaskSnapshot }
        dgos.aiTask.events: { scopes: [ai_task.read], operationId: streamAiTaskEvents, response: AppTaskEventBatch }
        dgos.aiTask.cancel: { scopes: [ai_task.cancel], operationId: cancelAiTask, response: AITaskSnapshot }
        dgos.artifact.read: { scopes: [artifact.read], operationId: readArtifact, response: ArtifactContent }
        dgos.system.context.read: { scopes: [dgos.system.context.read], response: AppSystemContext }
        dgos.system.context.events: { scopes: [dgos.system.context.events, dgos.system.context.read], response: AppContextEventBatch }
    AppSystemContext:
      type: object
      additionalProperties: false
      required: [contextVersion, instanceId, appId, appearance, locale, grid, networkSummary, issuedAt]
      properties:
        contextVersion: { type: string, pattern: '^[1-9][0-9]*$' }
        instanceId: { type: string, format: uuid }
        appId: { type: string }
        appearance: { $ref: '#/components/schemas/AppearanceSettings' }
        locale: { $ref: '#/components/schemas/LocaleSettings' }
        grid: { $ref: '#/components/schemas/GridSettings' }
        networkSummary: { $ref: '#/components/schemas/NetworkProxySummary' }
        issuedAt: { type: string, format: date-time }
      description: Instance-bound read-only application projection of authoritative System settings. No global appPermissions, other subjects, secret/manualProxyRef/endpoint or fabricated native window state. Host applies window material/scale; APP consumes content tokens and effective locale. appId/instanceId derived from authenticated launch binding.
    AppContextEventBatch:
      type: object
      additionalProperties: false
      required: [items, cursor, reset]
      properties:
        cursor: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        reset: { type: boolean, description: True when retained change history cannot satisfy cursor; return latest snapshot and replace local context }
        items:
          type: array
          maxItems: 1
          items: { $ref: '#/components/schemas/AppSystemContext' }
      description: Finite read-only subscription polling through existing bridge request/result. Return latest coherent snapshot if version advanced, else empty items and unchanged cursor. May coalesce intermediate settings changes; not Task delta semantics. No raw SSE URL or new push message.
    ModelSelectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [providerConfigId, modelId, displayName, intent]
            properties:
              providerConfigId: { type: string }
              modelId: { type: string }
              displayName: { type: string }
              intent: { type: string, enum: [text.chat] }
    ModelResolution:
      type: object
      additionalProperties: false
      required: [providerConfigId, modelId, intent, descriptorVersion, profile, workflow, defaults, limits, uiSchemas, assets]
      properties:
        providerConfigId: { type: string }
        modelId: { type: string }
        intent: { type: string, enum: [text.chat] }
        descriptorVersion: { type: string }
        profile: { type: string, enum: [chat.completions, responses] }
        workflow: { type: string, enum: [text.chat] }
        defaults: { $ref: '#/components/schemas/TextProfileDefaults' }
        limits: { $ref: '#/components/schemas/TextProfileLimits' }
        uiSchemas: { $ref: '#/components/schemas/TextProfileUi' }
        assets: { type: object, additionalProperties: false, maxProperties: 0 }
        protocolId: { type: string, description: Present with protocolVersion when an explicit registered declaration was selected }
        protocolVersion: { type: string }
    AppTaskEventBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AITaskEvent' } }
    ArtifactContent:
      type: object
      additionalProperties: false
      required: [artifactId, mimeType, content]
      properties:
        artifactId: { type: string }
        mimeType: { type: string }
        content: { type: string }
    ActionResolveRequest:
      type: object
      additionalProperties: false
      required: [requestId, text]
      properties:
        requestId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4096, description: User intent, never interpreted as code, path or arbitrary handler URL }
    ActionResolveResponse:
      type: object
      additionalProperties: false
      required: [requestId, candidates]
      properties:
        requestId: { type: string }
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [actionId, actionVersion, input, risk, permission, executable]
            properties:
              actionId: { type: string, description: Existing authorized registered action only }
              actionVersion: { type: string }
              input: { type: object, description: Validated registered input schema, redacted; no secret material }
              risk: { type: string, enum: [read, write, external, destructive] }
              permission: { type: string, enum: [allow, ask], description: Denied candidates are omitted; ask still requires consent before execution }
              executable: { type: boolean, enum: [false] }
    ActionNavigation:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { type: string, enum: [system.settings, provider.settings, skill.management, mcp.management, app.catalog] }
    AppPackageEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, manifest, files, resourceDigests, keyId, signature]
      description: Ed25519 signature over UTF-8 canonical JSON of manifest and resourceDigests. Operator-configured limits default to 1000 files and 32 MiB decoded content. HTTP encoded-body limit must account for base64 overhead and reject excess before processing.
      properties:
        requestId: { type: string, format: uuid }
        manifest:
          type: object
          description: Must validate against V1-app-manifest.schema.json (JSON Schema 2020-12); this object does not grant trust or catalog approval.
          externalDocs: { url: 'V1-app-manifest.schema.json' }
        files: { type: object, additionalProperties: { type: string, format: byte }, description: Normalized package-relative POSIX path to strict base64 bytes; no traversal, absolute paths, symlinks or installer scripts }
        resourceDigests: { type: object, additionalProperties: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }, description: Exactly the files key set, each digest recomputed from decoded bytes }
        keyId: { type: string, minLength: 1, description: Selects an already provisioned non-revoked operator trust root; cannot supply a root }
        signature: { type: string, format: byte, description: Ed25519 signature, strict base64 of 64 bytes }
    AppPackageRecord:
      type: object
      required: [appId, version, build, releaseChannel, digest, source, catalogState, trustLevel, uninstallPolicy]
      properties:
        appId: { type: string }
        version: { type: string }
        build: { type: integer, minimum: 0 }
        releaseChannel: { type: string, enum: [stable, beta, dev] }
        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        source: { type: string, enum: [official, admin, developer], readOnly: true }
        catalogState: { type: string, enum: [official, pending_review, approved, rejected, withdrawn], readOnly: true }
        trustLevel: { type: string, enum: [standard, trusted, system], readOnly: true, description: Effective platform grant, never copied from requested manifest trust }
        uninstallPolicy: { type: string, enum: [user-removable, protected-preinstall], readOnly: true }
        manifest: { type: object, description: Original signed manifest; trustLevel inside is only the requested value }
        reviewVersion: { type: integer, minimum: 1 }
    AppReleaseMutation:
      type: object
      additionalProperties: false
      required: [requestId, version, build, releaseChannel]
      properties:
        requestId: { type: string, format: uuid }
        version: { type: string }
        build: { type: integer, minimum: 0 }
        releaseChannel: { type: string, enum: [stable, beta, dev] }
        baseVersion: { type: integer, minimum: 1, description: Required when mutating an existing versioned install/review record; checked again under the installation/review lock }
        reason: { type: string, description: Redacted administrator review rationale }
    AppMutation:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
    AppInstallRecord:
      type: object
      required: [appId, state, dataRetained]
      properties:
        appId: { type: string }
        version: { type: string }
        build: { type: integer, minimum: 0 }
        releaseChannel: { type: string, enum: [stable, beta, dev] }
        state: { type: string, enum: [discovered, installed, active, update_pending, health_check_failed, rolled_back, uninstall_requested, uninstalled] }
        dataRetained: { type: boolean }
        digest: { type: string }
        previousDigest: { type: string, nullable: true }
        versionNumber: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [errorKey, message, requestId]
      properties:
        errorKey: { type: string, description: Stable machine-readable error key }
        message: { type: string, description: Safe human-readable message without secrets }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true, description: Redacted diagnostic details }
    AdminBootstrapRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [displayName, credential]
          properties:
            displayName: { type: string, minLength: 1 }
            credential: { type: string, format: password, writeOnly: true }
            recoveryRef: { type: string, writeOnly: true, description: Secret boundary reference }
    AdminLoginRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [principalHint, credential]
          properties:
            principalHint: { type: string, description: Opaque login hint; errors must remain non-enumerable }
            credential: { type: string, format: password, writeOnly: true }
    SessionRenewRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
    AdminSessionReceipt:
      type: object
      required: [requestId, principalId, sessionId, state, expiresAt, sessionVersion]
      properties:
        requestId: { type: string }
        principalId: { type: string }
        sessionId: { type: string }
        state: { type: string, enum: [active, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        sessionVersion: { type: string }
        authFreshUntil: { type: string, format: date-time }
    AdminSession:
      allOf:
        - $ref: '#/components/schemas/AdminSessionReceipt'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            lastActiveAt: { type: string, format: date-time }
            deviceSummary: { type: object, additionalProperties: true }
    AdminSessionList:
      type: object
      additionalProperties: false
      required: [requestId, items]
      properties:
        requestId: { type: string }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AdminSessionDevice' } }
        nextCursor: { type: string, description: Absent on last page }
    AdminSessionDevice:
      type: object
      additionalProperties: false
      required: [sessionManagementId, current, state, createdAt, expiresAt, sessionVersion, deviceSummary]
      properties:
        sessionManagementId: { type: string, pattern: '^sm_[A-Za-z0-9_-]{32,128}$', description: Stable opaque random management reference mapped server-side to same-owner session; cannot authenticate or derive credential }
        current: { type: boolean }
        state: { type: string, enum: [active, revoked, expired] }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        sessionVersion: { type: string, pattern: '^[1-9][0-9]*$' }
        deviceSummary:
          type: object
          additionalProperties: false
          required: [host]
          properties:
            host: { type: string, enum: [web, macos, unknown] }
            label: { type: string, maxLength: 128, description: Sanitized coarse device/browser label, not raw User-Agent or asserted identity }
      description: Derive expired from server time even if stored state remains active. Device hints never confer authorization; missing historic hints use unknown, never fabricate device facts.
    AdminSessionRevocationReceipt:
      type: object
      additionalProperties: false
      required: [requestId, sessionManagementId, state, revokedAt, sessionVersion]
      properties:
        requestId: { type: string }
        sessionManagementId: { type: string, pattern: '^sm_[A-Za-z0-9_-]{32,128}$' }
        state: { type: string, enum: [revoked] }
        revokedAt: { type: string, format: date-time }
        sessionVersion: { type: string, pattern: '^[1-9][0-9]*$' }
    ApiKeyMetadata:
      type: object
      required: [keyId, ownerId, name, prefix, scopes, status, createdAt]
      properties:
        keyId: { type: string }
        ownerId: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, rotation_pending, expired, revoked] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        rotationGroupId: { type: string }
        version: { type: string }
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiKeyMetadata' } }
        nextCursor: { type: string, nullable: true }
    CreateApiKeyRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [ownerId, name, scopes]
          properties:
            ownerId: { type: string }
            name: { type: string, minLength: 1 }
            scopes: { type: array, minItems: 1, items: { type: string } }
            expiresAt: { type: string, format: date-time }
    RotateApiKeyRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
        - type: object
          properties:
            overlapUntil: { type: string, format: date-time }
    ApiKeySecretReceipt:
      type: object
      required: [requestId, key, secret]
      properties:
        requestId: { type: string }
        key: { $ref: '#/components/schemas/ApiKeyMetadata' }
        secret: { type: string, writeOnly: true, description: One-time secret; never returned again }
        previousKeyId: { type: string }
    ProviderAccount:
      type: object
      required: [accountId, ownerId, protocolType, status, credentialState, version]
      properties:
        accountId: { type: string }
        ownerId: { type: string }
        protocolType: { type: string }
        displayName: { type: string }
        scope: { type: object, additionalProperties: true }
        credentialState: { type: string, enum: [missing, configured, invalid, unavailable] }
        status: { type: string, enum: [draft, credential_pending, ready, error, disabled, revoked, deleted] }
        defaultForProtocol: { type: boolean }
        version: { type: string }
        createdAt: { type: string, format: date-time }
    ProviderAccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProviderAccount' } }
        nextCursor: { type: string, nullable: true }
    CreateProviderAccountRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [ownerId, protocolType, displayName, credential]
          properties:
            ownerId: { type: string }
            protocolType: { type: string }
            displayName: { type: string, minLength: 1 }
            credential: { type: string, format: password, writeOnly: true }
            scope: { type: object, additionalProperties: true }
            defaultForProtocol: { type: boolean, default: false }
    BindProviderAccountRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
        - type: object
          required: [providerConfigId]
          properties:
            providerConfigId: { type: string }
    ProviderBinding:
      type: object
      required: [bindingId, accountId, providerConfigId, version, state]
      properties:
        bindingId: { type: string }
        accountId: { type: string }
        providerConfigId: { type: string }
        version: { type: string }
        state: { type: string, enum: [active, unbound] }
    ProviderAccountStateRequest:
      description: ready requires a successful controlled ConnectionTest for the same current accountVersion, matching protocol/config snapshot and caller scope. Creating credentials produces credential_pending; probe success alone does not activate account or ProviderConfig. Explicit state ready remains version-checked and audited. Changing credentials/account version invalidates old probe eligibility.
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [ready, disabled, revoked] }
            connectionTestId: { type: string, description: Required for ready; server verifies succeeded and current accountVersion, never trusts caller state }
    StartConnectionTestRequest:
      description: Controlled diagnostic accepts credential_pending or ready account with usable credentials and valid owner/config/protocol authorization; it does not grant Task admission. A successful version-bound result can be referenced by explicit account state ready.
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [accountId, protocolVersion]
          properties:
            accountId: { type: string }
            providerConfigId: { type: string }
            accountVersion: { type: string }
            configVersion: { type: string }
            protocolVersion: { type: string }
    ConnectionTest:
      type: object
      required: [testId, requestId, accountId, status, createdAt]
      properties:
        testId: { type: string }
        requestId: { type: string }
        accountId: { type: string }
        providerConfigId: { type: string }
        accountVersion: { type: string }
        configVersion: { type: string }
        protocolVersion: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out, cancel_requested, cancelled] }
        reasonCode: { type: string, enum: [network_unreachable, tls_invalid, endpoint_invalid, authentication_failed, rate_limited, protocol_mismatch, upstream_unavailable, policy_blocked] }
        latencyMs: { type: integer, minimum: 0 }
        capabilitySummary: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      required: [eventId, occurredAt, requestId, actor, action, result]
      properties:
        eventId: { type: string }
        occurredAt: { type: string, format: date-time }
        requestId: { type: string }
        actor: { type: object, additionalProperties: true }
        action: { type: string }
        target: { type: object, additionalProperties: true }
        result: { type: string, enum: [allowed, denied, succeeded, failed] }
        reasonCode: { type: string }
        policyVersion: { type: string }
        summary: { type: object, additionalProperties: true, description: Redacted summary only }
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: string, nullable: true }
    GovernancePolicy:
      type: object
      required: [policyVersion, auditRetentionDays, version]
      properties:
        policyVersion: { type: string }
        auditRetentionDays: { type: integer, minimum: 1 }
        cacheRetentionDays: { type: integer, minimum: 1 }
        revokedSessionRetentionDays: { type: integer, minimum: 1 }
        version: { type: string }
        updatedAt: { type: string, format: date-time }
    GovernancePolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
        - type: object
          required: [auditRetentionDays]
          properties:
            auditRetentionDays: { type: integer, minimum: 1 }
            cacheRetentionDays: { type: integer, minimum: 1 }
            revokedSessionRetentionDays: { type: integer, minimum: 1 }
            reason: { type: string, minLength: 1 }
    RetentionPreview:
      type: object
      required: [previewDigest, policyVersion, cutoffAt, eligibleCount, revokedSessionCount, packageRetention]
      properties:
        previewDigest: { type: string, description: Server digest covers policy/cutoffs and all category counts including packageRetention }
        policyVersion: { type: string }
        cutoffAt: { type: string, format: date-time }
        revokedSessionCutoffAt: { type: string, format: date-time }
        eligibleCount: { type: integer, minimum: 0, description: Existing audit category count; do not silently redefine as aggregate }
        revokedSessionCount: { type: integer, minimum: 0 }
        packageRetention:
          type: object
          additionalProperties: false
          required: [failedInstall, stagedPackage]
          properties:
            failedInstall: { $ref: '#/components/schemas/RetentionCategoryCounts' }
            stagedPackage: { $ref: '#/components/schemas/RetentionCategoryCounts' }
      description: Package categories use frozen 30-day lifecycle timestamps; protected candidates are separate from eligible candidates. Never infer authorization to remove active releases, rollback assets, user data, referenced Artifacts or unresolved receipts from counts alone. RetentionJob deleted/skipped/failure counts retain existing semantics.
    RetentionCategoryCounts:
      type: object
      additionalProperties: false
      required: [eligibleCount, protectedCount]
      properties:
        eligibleCount: { type: integer, minimum: 0 }
        protectedCount: { type: integer, minimum: 0 }
    RetentionSweepRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [previewDigest]
          properties:
            previewDigest: { type: string }
            dryRun: { type: boolean, default: false }
    RetentionJob:
      type: object
      required: [jobId, requestId, state, checkpoint]
      properties:
        jobId: { type: string }
        requestId: { type: string }
        state: { type: string, enum: [planned, running, completed, partial, failed] }
        checkpoint: { type: string }
        deletedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        failureCount: { type: integer, minimum: 0 }
        skipReasons: { type: array, items: { type: string } }
    QuotaPreflightRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [target, metric, amount]
          properties:
            target: { type: object, additionalProperties: true }
            metric: { type: string, enum: [requests, input_tokens, output_tokens, total_tokens] }
            amount: { type: number, minimum: 0 }
            inputDigest: { type: string }
    QuotaDecision:
      type: object
      required: [requestId, decision, policyVersion]
      properties:
        requestId: { type: string }
        decision: { type: string, enum: [allow, warn, deny] }
        reasonCode: { type: string }
        policyVersion: { type: string }
        remaining: { type: number, minimum: 0 }
    QuotaReservationRequest:
      allOf:
        - $ref: '#/components/schemas/QuotaPreflightRequest'
        - type: object
          required: [taskId, attemptId]
          properties:
            taskId: { type: string }
            attemptId: { type: string }
            expiresAt: { type: string, format: date-time }
    QuotaReservation:
      type: object
      required: [reservationId, requestId, taskId, attemptId, reservedAmount, state, expiresAt]
      properties:
        reservationId: { type: string }
        requestId: { type: string }
        taskId: { type: string }
        attemptId: { type: string }
        reservedAmount: { type: number, minimum: 0 }
        state: { type: string, enum: [reserved, settled, released, expired, reconciliation_required, needs_review], description: needs_review retains uncertain dispatched usage for evidence-based reconciliation; never blindly re-dispatch Provider }
        expiresAt: { type: string, format: date-time }
    UsageSettlementRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [taskId, attemptId, terminalState]
          properties:
            taskId: { type: string }
            attemptId: { type: string }
            terminalState: { type: string, enum: [completed, failed, cancelled, timed_out] }
            usage: { $ref: '#/components/schemas/UsageInput' }
    UsageInput:
      type: object
      properties:
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        totalTokens: { type: integer, minimum: 0 }
        status: { type: string, enum: [final, unavailable, estimated] }
        sourceDigest: { type: string }
    UsageSettlement:
      type: object
      required: [reservationId, state, requestId]
      properties:
        reservationId: { type: string }
        requestId: { type: string }
        state: { type: string, enum: [settled, released, reconciliation_required, needs_review] }
        usageEventId: { type: string }
        usageStatus: { type: string, enum: [final, unavailable, estimated] }
    UsagePage:
      type: object
      required: [items, from, to]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UsageAggregate' } }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        nextCursor: { type: string, nullable: true }
    UsageAggregate:
      type: object
      required: [scope, metric, amount, usageStatus]
      properties:
        scope: { type: object, additionalProperties: true }
        metric: { type: string }
        amount: { type: number, minimum: 0 }
        usageStatus: { type: string, enum: [final, unavailable, estimated, mixed] }
        aggregateVersion: { type: string }
    QuotaPolicy:
      type: object
      required: [policyId, scope, metric, limit, window, version, effectiveAt]
      properties:
        policyId: { type: string }
        scope: { type: object, additionalProperties: true }
        metric: { type: string }
        limit: { type: number, minimum: 0 }
        softLimit: { type: number, minimum: 0 }
        window: { type: string, enum: [hour, day, month, rolling] }
        version: { type: string }
        effectiveAt: { type: string, format: date-time }
        failOpen: { type: boolean, default: false }
    QuotaPolicyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuotaPolicy' } }
    QuotaPolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/VersionedRequest'
        - type: object
          required: [scope, metric, limit, window, effectiveAt]
          properties:
            scope: { type: object, additionalProperties: true }
            metric: { type: string }
            limit: { type: number, minimum: 0 }
            softLimit: { type: number, minimum: 0 }
            window: { type: string, enum: [hour, day, month, rolling] }
            effectiveAt: { type: string, format: date-time }
            failOpen: { type: boolean, default: false }
    VersionedRequest:
      type: object
      required: [baseVersion]
      properties:
        baseVersion: { type: string }
    AppearanceSettings:
      type: object
      required: [appearanceMode, windowMaterial, interfaceMode, displayScale, wallpaperFollowsAppearance]
      properties:
        appearanceMode: { type: string, enum: [light, dark, system] }
        windowMaterial: { type: string }
        interfaceMode: { type: string }
        displayScale: { type: number, enum: [0.75, 1.0, 1.25, 1.5, 1.75] }
        lightWallpaperRef: { type: string }
        darkWallpaperRef: { type: string }
        wallpaperFollowsAppearance: { type: boolean }
    LocaleSettings:
      type: object
      required: [uiLocale, effectiveLocale, regionFormat, assistantLanguage, projectContentLanguage]
      properties:
        uiLocale: { type: string }
        effectiveLocale: { type: string }
        regionFormat: { type: string }
        assistantLanguage: { type: string }
        projectContentLanguage: { type: string }
        fallbackState: { type: string, enum: [none, partial, full] }
    NetworkProxySettings:
      type: object
      required: [proxyMode, effectiveRoute, affectedServices, restartRequired]
      properties:
        proxyMode: { type: string, enum: [system, manual, off] }
        manualProxyRef: { type: string, description: Secret boundary reference; never a credential value }
        effectiveRoute: { type: string }
        affectedServices: { type: array, items: { type: string } }
        restartRequired: { type: boolean }
    NetworkProxySummary:
      type: object
      required: [proxyMode, effectiveRoute, affectedServices, restartRequired]
      properties:
        proxyMode: { type: string, enum: [system, manual, off] }
        effectiveRoute: { type: string }
        affectedServices: { type: array, items: { type: string } }
        restartRequired: { type: boolean }
    GridSettings:
      type: object
      required: [enabled, style, spacing, majorLineEvery, showAxes, snapEnabled, snapTolerance, colorToken, opacity]
      properties:
        enabled: { type: boolean }
        style: { type: string, enum: [dot, line] }
        spacing: { type: number, minimum: 1 }
        majorLineEvery: { type: integer, minimum: 1 }
        showAxes: { type: boolean }
        snapEnabled: { type: boolean }
        snapTolerance: { type: number, minimum: 0 }
        colorToken: { type: string }
        opacity: { type: number, minimum: 0, maximum: 1 }
    PermissionRule:
      type: object
      required: [appId, subjectType, subjectId, capability, scope, decision]
      properties:
        appId: { type: string }
        subjectType: { type: string, enum: [user, organization, team, system] }
        subjectId: { type: string }
        capability: { type: string }
        scope: { type: object, additionalProperties: true }
        decision: { type: string, enum: [allow, ask, deny] }
        source: { type: string, enum: [manifest, user, admin, system] }
    SystemSettingsSnapshot:
      type: object
      additionalProperties: false
      required: [settingsVersion, appearance, locale, network, grid, restartRequired]
      properties:
        settingsVersion: { type: string }
        appearance: { $ref: '#/components/schemas/AppearanceSettings' }
        locale: { $ref: '#/components/schemas/LocaleSettings' }
        network: { $ref: '#/components/schemas/NetworkProxySettings' }
        grid: { $ref: '#/components/schemas/GridSettings' }
        privacy: { type: object, additionalProperties: true }
        appPermissions: { type: array, items: { $ref: '#/components/schemas/PermissionRule' } }
        restartRequired: { type: boolean }
        affectedServices: { type: array, items: { type: string } }
    SystemSettingsPatch:
      type: object
      additionalProperties: false
      required: [requestId, baseVersion, domain, patch]
      description: Unique HTTP projection. Domain fields only in patch; reject old nested patch.domain/value. Merge and validate the full domain under versioned transaction; no partial writes.
      properties:
        requestId: { type: string }
        baseVersion: { type: string }
        domain: { type: string, enum: [appearance, locale, network, grid, privacy, appPermissions] }
        patch: { type: object, additionalProperties: true, description: Only declared writable fields of selected domain, no derived effective-value override }
    SystemContextSnapshot:
      type: object
      required: [contextVersion, appId, appearance, locale, networkSummary, grid, windowState, lifecycleState]
      properties:
        contextVersion: { type: string }
        appId: { type: string }
        appearance: { $ref: '#/components/schemas/AppearanceSettings' }
        locale: { $ref: '#/components/schemas/LocaleSettings' }
        networkSummary: { $ref: '#/components/schemas/NetworkProxySummary' }
        grid: { $ref: '#/components/schemas/GridSettings' }
        windowState: { type: object, additionalProperties: true }
        lifecycleState: { type: string }
        issuedAt: { type: string, format: date-time }
    PermissionCheckRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/PermissionRule'
    PermissionRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - $ref: '#/components/schemas/PermissionRule'
    PermissionDecisionResult:
      type: object
      required: [requestId, decision, reasonCode, policyVersion]
      properties:
        requestId: { type: string }
        decision: { type: string, enum: [allow, ask, deny] }
        reasonCode: { type: string }
        policyVersion: { type: string }
        auditRef: { type: string }
    RequestEnvelope:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
    ProviderConfigInput:
      type: object
      additionalProperties: false
      required: [requestId, displayName, protocolType, baseUrl, providerAccountId]
      properties:
        requestId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1 }
        protocolType: { type: string, example: openai-compatible }
        baseUrl: { type: string, format: uri }
        providerAccountId: { type: string, minLength: 1, description: Existing authorized ProviderAccount; credentials remain in SecretService }
        enabled: { type: boolean, default: true }
        capabilityProtocolId: { type: string, minLength: 1 }
        capabilityProtocolVersion: { $ref: '#/components/schemas/ExactProtocolVersion' }
      allOf: [{ $ref: '#/components/schemas/PairedProtocolBinding' }]
      description: Explicit immutable capability protocol binding. Supply both ID/version or omit both to use the installed Adapter built-in profile. Validate ownership, active exact version and protocol compatibility; never bind latest implicitly. No credentials in this request.
    ProviderConfig:
      type: object
      required: [id, protocolType, validationState, adapterVersion, version]
      properties:
        id: { type: string }
        protocolType: { type: string }
        displayName: { type: string }
        baseUrl: { type: string, format: uri }
        credentialStatus: { type: string, enum: [missing, configured, invalid, unknown] }
        validationState: { type: string, enum: [draft, validating, active, ready, error, disabled, revoked] }
        adapterVersion: { type: string, minLength: 1, description: Actual bound published Adapter version persisted or verified by reference; no fabricated default or latest-version substitution }
        version: { type: string, pattern: '^[1-9][0-9]*$', description: Configuration CAS revision, distinct from Adapter version and declaration SemVer }
        capabilityProtocolId: { type: string, minLength: 1 }
        capabilityProtocolVersion: { $ref: '#/components/schemas/ExactProtocolVersion' }
      allOf: [{ $ref: '#/components/schemas/PairedProtocolBinding' }]
    ProviderConfigUpdate:
      type: object
      additionalProperties: false
      required: [requestId, baseVersion]
      properties:
        requestId: { type: string, format: uuid }
        baseVersion: { type: string, pattern: '^[1-9][0-9]*$' }
        displayName: { type: string, minLength: 1 }
        protocolType: { type: string, minLength: 1 }
        baseUrl: { type: string, format: uri }
        enabled: { type: boolean }
        capabilityProtocolId: { type: string, minLength: 1 }
        capabilityProtocolVersion: { $ref: '#/components/schemas/ExactProtocolVersion' }
      allOf: [{ $ref: '#/components/schemas/PairedProtocolBinding' }]
      description: CAS against ProviderConfig.version. Omitted pair preserves binding; supplied pair explicitly selects another active immutable version and requires revalidation before new tasks. Half-pair, null, empty or latest alias rejected. Declaration publication never migrates configs. Body identity/account reassignment not accepted.
    ExactProtocolVersion:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
    PairedProtocolBinding:
      description: Both explicit references or neither; never infer the missing half from current configuration.
      oneOf:
        - required: [capabilityProtocolId, capabilityProtocolVersion]
        - not:
            anyOf:
              - required: [capabilityProtocolId]
              - required: [capabilityProtocolVersion]
    ProtocolAdapterRegistration:
      type: object
      required: [protocolType, adapterVersion, configSchemaRef, capabilityDescriptorSchemaVersion, status]
      properties:
        protocolType: { type: string }
        adapterVersion: { type: string }
        configSchemaRef: { type: string }
        capabilityDescriptorSchemaVersion: { type: string }
        taskModes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled, incompatible] }
    ProviderCapabilityDescriptor:
      type: object
      required: [descriptorVersion, inputs, outputs, taskModes, streaming, cancellation, modelCatalog]
      properties:
        descriptorVersion: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        taskModes: { type: array, items: { type: string } }
        operationProfiles:
          type: array
          description: Provider operation profiles supported by this adapter, such as responses or chat-completions.
          items: { type: string }
        streaming:
          type: object
          required: [text]
          properties: { text: { type: boolean } }
        cancellation: { type: boolean }
        tools:
          type: object
          description: Optional per-model tool capability declaration; does not grant DGOS permission by itself.
          additionalProperties: true
        modelCatalog: { type: string, enum: [remote, manual, hybrid] }
        limits: { type: object, additionalProperties: true }
    CapabilityProtocolRegistration:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, id, version, executor, capabilities, operations, workflows, modelProfiles]
      properties:
        schemaVersion: { type: string, enum: [dgos-capability/v1] }
        kind: { type: string, enum: [model] }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]*$' }
        version: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$', description: Immutable exact declaration SemVer, not numeric registry revision }
        registryVersion: { type: integer, minimum: 1, readOnly: true, description: State concurrency revision incremented on every successful mutation, distinct from declaration version }
        digest: { type: string, readOnly: true }
        label: { type: string }
        summary: { type: string }
        executor:
          type: object
          additionalProperties: false
          required: [type, engine]
          properties:
            type: { type: string, enum: [declarative] }
            engine: { type: string, enum: [dgos-text-v1] }
        capabilities: { type: array, minItems: 1, maxItems: 1, items: { type: string, enum: [text.chat] } }
        operations: { type: object, minProperties: 1, additionalProperties: { $ref: '#/components/schemas/TextProtocolOperation' } }
        workflows:
          type: object
          additionalProperties: false
          required: [text.chat]
          properties:
            text.chat:
              type: object
              additionalProperties: false
              required: [submit]
              properties:
                submit: { type: string, description: Key of a declared text operation; no poll/download/upload or arbitrary workflow }
        modelProfiles: { type: object, minProperties: 1, additionalProperties: { $ref: '#/components/schemas/TextModelProfile' } }
        defaults: { $ref: '#/components/schemas/TextProfileDefaults' }
        limits: { $ref: '#/components/schemas/TextProfileLimits' }
        uiSchemas: { $ref: '#/components/schemas/TextProfileUi' }
        assets: { type: object, maxProperties: 0, additionalProperties: false }
        status: { type: string, enum: [draft, validating, active, rejected, disabled], readOnly: true }
        sourceRef: { type: string, readOnly: true, description: Controlled provenance assigned by registry, never a fetchable caller URL }
    TextProtocolOperation:
      type: object
      additionalProperties: false
      required: [profile, method, path]
      properties:
        profile: { type: string, enum: [chat.completions, responses] }
        method: { type: string, enum: [POST] }
        path: { type: string, enum: [/chat/completions, /responses], description: Must match profile; host/credentials/headers only from installed adapter and ProviderConfig }
    TextModelProfile:
      type: object
      additionalProperties: false
      required: [modelNames, workflow]
      properties:
        modelNames: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 }, description: Exact model IDs or explicitly declared compatible aliases; no guessing or wildcard fallback }
        workflow: { type: string, enum: [text.chat] }
        defaults: { $ref: '#/components/schemas/TextProfileDefaults' }
        limits: { $ref: '#/components/schemas/TextProfileLimits' }
        uiSchemas: { $ref: '#/components/schemas/TextProfileUi' }
    TextProfileDefaults:
      $ref: '#/components/schemas/TextTaskParameters'
    TextTaskParameters:
      type: object
      additionalProperties: false
      description: Only text parameters recognized by the bound Adapter/model may be sent. Defaults merge by key; tighter descriptor/Profile/platform limits apply server-side. Unsupported parameter, non-finite number or bound violation rejects before Task/reservation/upstream side effects; no clamping/coercion.
      properties:
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxOutputTokens: { type: integer, minimum: 1, maximum: 9007199254740991 }
    TextProfileLimits:
      type: object
      additionalProperties: false
      properties:
        maxInputCharacters: { type: integer, minimum: 1 }
        maxOutputTokens: { type: integer, minimum: 1 }
    TextProfileUi:
      type: object
      additionalProperties: false
      properties:
        parameters: { type: array, uniqueItems: true, items: { type: string, enum: [temperature, maxOutputTokens] }, description: Parameters must also be supported by the installed adapter/model descriptor; no script/HTML or arbitrary schema execution }
    CapabilityProtocolValidationRequest:
      type: object
      additionalProperties: false
      required: [requestId, declaration]
      properties:
        requestId: { type: string, format: uuid }
        declaration: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
    CapabilityProtocolPublishRequest:
      type: object
      additionalProperties: false
      required: [requestId, declaration, validationDigest, confirmationId]
      properties:
        requestId: { type: string, format: uuid }
        declaration: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
        validationDigest: { type: string, description: Recomputed by server; must bind identical validated declaration }
        confirmationId: { type: string, format: uuid, description: Ticket from issueCapabilityProtocolConfirmation; same requestId and full binding required }
    CapabilityProtocolConfirmationRequest:
      oneOf:
        - $ref: '#/components/schemas/CapabilityProtocolPublishConfirmation'
        - $ref: '#/components/schemas/CapabilityProtocolStateConfirmation'
      discriminator:
        propertyName: operation
        mapping:
          provider.protocol.publish: '#/components/schemas/CapabilityProtocolPublishConfirmation'
          provider.protocol.state: '#/components/schemas/CapabilityProtocolStateConfirmation'
    CapabilityProtocolPublishConfirmation:
      type: object
      additionalProperties: false
      required: [requestId, operation, protocolId, version, declaration, validationDigest]
      properties:
        requestId: { type: string, format: uuid }
        operation: { type: string, enum: [provider.protocol.publish] }
        protocolId: { type: string, description: Must equal declaration.id }
        version: { type: string, description: Must equal declaration.version; immutable exact SemVer }
        declaration: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
        validationDigest: { type: string, pattern: '^[a-f0-9]{64}$', description: Echo validation digest; server recomputes from validated declaration }
    CapabilityProtocolStateConfirmation:
      type: object
      additionalProperties: false
      required: [requestId, operation, protocolId, version, baseVersion, state]
      properties:
        requestId: { type: string, format: uuid }
        operation: { type: string, enum: [provider.protocol.state] }
        protocolId: { type: string, minLength: 1 }
        version: { type: string, description: Immutable exact declaration SemVer }
        baseVersion: { type: integer, minimum: 1 }
        state: { type: string, enum: [active, disabled] }
    CapabilityProtocolConfirmationReceipt:
      type: object
      additionalProperties: false
      required: [confirmationId, requestId, expiresAt, digest]
      properties:
        confirmationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, description: Five minutes after first issuance; identical reissue never extends it }
        digest: { type: string, pattern: '^[a-f0-9]{64}$', description: Server-bound declaration digest or state payload digest; no subject/session/secret projection }
    CapabilityProtocolStateRequest:
      type: object
      additionalProperties: false
      required: [requestId, baseVersion, state, confirmationId]
      properties:
        requestId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
        state: { type: string, enum: [active, disabled] }
        confirmationId: { type: string, format: uuid }
    ProviderValidationResult:
      type: object
      required: [provider, descriptor]
      properties:
        provider: { $ref: '#/components/schemas/ProviderConfig' }
        descriptor: { $ref: '#/components/schemas/ProviderCapabilityDescriptor' }
    ModelCatalogEntry:
      type: object
      required: [modelId, modelRef, detectedCapabilities, availability]
      properties:
        modelId: { type: string }
        modelRef: { type: string }
        displayName: { type: string }
        detectedCapabilities: { type: array, items: { type: string } }
        availability: { type: string, enum: [available, unavailable, unknown, stale] }
        lastSeenAt: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/ModelCapabilityPolicy' }
    ModelCapabilityPolicy:
      type: object
      required: [providerId, modelId, enabled, assignedCapabilities, defaultFor]
      properties:
        providerId: { type: string }
        modelId: { type: string }
        enabled: { type: boolean }
        assignedCapabilities: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
        defaultFor: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
        classificationSource: { type: string, enum: [adapter, user, mixed, pending] }
        outputSpec: { type: object, additionalProperties: true }
        pricing: { type: object, additionalProperties: true }
    ModelCapabilityPolicyUpdate:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [modelId, enabled, assignedCapabilities, defaultFor]
          properties:
            modelId: { type: string }
            enabled: { type: boolean }
            assignedCapabilities: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
            defaultFor: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
            outputSpec: { type: object, additionalProperties: true }
            pricing: { type: object, additionalProperties: true }
    ModelCapability:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      description: Registered DGOS model capability. The registry may describe text, image-generation, video-generation, audio-generation, understanding and embedding capabilities; V1 task execution exposes text only, while media execution requires a later version gate.
    AITaskSubmitRequest:
      type: object
      additionalProperties: false
      required: [requestId, target, intent, input, options]
      properties:
        requestId: { type: string, format: uuid }
        target: { type: string, minLength: 1, description: Registered authorized text target; never caller URL }
        intent: { type: string, enum: [text.chat] }
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: { type: string, description: Count Unicode scalar values against effective maxInputCharacters; do not silently truncate }
        options: { $ref: '#/components/schemas/TextTaskOptions' }
      description: Server normalizes parameters and persists a versioned resolved execution snapshot atomically with admission, Task/Attempt, reservation and audit. Same authorized requestId/input replays the original task before resolving current defaults. Dispatch rechecks current admission but executes the saved parameters/Profile snapshot; no mutable-default reread. See V1-Provider绑定与文本参数契约.md.
    TextTaskOptions:
      type: object
      additionalProperties: false
      required: [providerConfigId, modelId]
      properties:
        providerConfigId: { type: string, minLength: 1 }
        modelId: { type: string, minLength: 1 }
        parameters: { $ref: '#/components/schemas/TextTaskParameters' }
    AITaskReceipt:
      type: object
      required: [taskId, requestId, status]
      properties:
        taskId: { type: string }
        requestId: { type: string }
        status: { type: string, enum: [accepted, queued, running, succeeded, completed, failed, cancel_requested, cancelled, timed_out] }
        descriptorVersion: { type: string }
    AITaskSnapshot:
      type: object
      required: [taskId, status]
      properties:
        taskId: { type: string }
        status: { type: string, enum: [accepted, queued, running, succeeded, completed, failed, cancel_requested, cancelled, timed_out] }
        text: { type: string, description: Current sanitized text summary }
        artifactIds: { type: array, items: { type: string } }
        error:
          type: object
          properties:
            errorKey: { type: string, description: upstream_outcome_unknown means an attempted dispatch cannot be proven complete after recovery; Task stays failed and no automatic Provider resend is permitted }
            message: { type: string }
            retryable: { type: boolean, description: false for upstream_outcome_unknown }
    AITaskEvent:
      type: object
      required: [eventId, taskId, sequence, type, createdAt]
      properties:
        eventId: { type: string }
        taskId: { type: string }
        sequence: { type: integer, minimum: 0 }
        type: { type: string, enum: [task.accepted, text.delta, task.progress, task.completed, task.failed, task.cancelled, stream.reset] }
        delta: { type: string }
        snapshot: { $ref: '#/components/schemas/AITaskSnapshot' }
        createdAt: { type: string, format: date-time }
    ExtensionStateRequest:
      $ref: 'V1-extension.openapi.yaml#/components/schemas/StateRequest'
    ExtensionInstallRequest:
      $ref: 'V1-extension.openapi.yaml#/components/schemas/InstallRequest'
    ExtensionRecord:
      $ref: 'V1-extension.openapi.yaml#/components/schemas/Record'
    ExtensionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExtensionRecord' } }
    ActionDeclaration:
      type: object
      required: [actionId, actionVersion, appId, inputSchema, outputSchema, requiredCapabilities, risk, sideEffects, confirmation, idempotency, cancellable, state]
      properties:
        actionId: { type: string }
        actionVersion: { type: string }
        appId: { type: string }
        label: { type: object, additionalProperties: { type: string } }
        inputSchema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
        requiredCapabilities: { type: array, items: { type: string } }
        risk: { type: string, enum: [read, write, external, destructive] }
        sideEffects: { type: string, enum: [none, local-write, external-call, model-call, secret-use, destructive] }
        confirmation: { type: string, enum: [none, required, elevated] }
        idempotency: { type: string, enum: [safe, required, unsupported] }
        cancellable: { type: boolean }
        state: { type: string, enum: [ready, disabled, missing, denied, unavailable] }
    ActionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActionDeclaration' } }
    ActionPlanRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [input]
          properties:
            input: { type: object, additionalProperties: true }
    ActionPlan:
      type: object
      required: [actionId, actionVersion, input, confirmation, risk]
      properties:
        actionId: { type: string }
        actionVersion: { type: string }
        input: { type: object, additionalProperties: true }
        confirmation: { type: string, enum: [none, required, elevated] }
        risk: { type: string, enum: [read, write, external, destructive] }
        targetSummary: { type: string }
        inputSummary: { type: string }
    ActionExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          required: [input]
          properties:
            input: { type: object, additionalProperties: true }
            confirmationToken: { type: string, writeOnly: true }
    ActionRun:
      type: object
      required: [runId, actionId, actionVersion, requestId, status]
      properties:
        runId: { type: string }
        actionId: { type: string }
        actionVersion: { type: string }
        requestId: { type: string }
        taskId: { type: string }
        status: { type: string, enum: [planned, awaiting-confirmation, authorized, running, succeeded, denied, cancelled, failed, expired, missing] }
        result: { type: object, additionalProperties: true }
        resultSummary:
          type: object
          properties:
            navigation: { $ref: '#/components/schemas/ActionNavigation' }
        error: { type: object, additionalProperties: true }
