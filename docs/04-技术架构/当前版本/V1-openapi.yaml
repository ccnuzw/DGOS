openapi: 3.0.3
info:
  title: DGOS V1 Logical API
  version: "1.0.0"
  description: |
    DGOS V1 逻辑契约的 HTTPS JSON + SSE 投影。桌面 IPC 必须保持相同的动作、字段、权限和事件语义。
    该文件同时登记已实现的本地 contract projection 与尚未具备真实桌面/Web E2E 证据的 draft operation。
security:
  - dgosSession: []
  - dgosApiKey: []
servers:
  - url: https://localhost
    description: Docker Compose Web projection (planned)
tags:
  - name: system
  - name: providers
  - name: ai-tasks
  - name: skills
  - name: mcp
  - name: assistant
  - name: identity
  - name: secrets
  - name: governance
  - name: usage
  - name: apps
paths:
  /api/v1/system/network/proxy-configurations:
    post:
      tags: [system]
      operationId: provisionManualProxy
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: planned
      security: [{ dgosSession: [] }]
      description: Fresh active administrator Session, system.settings.write and CSRF required; API Key and APP bridge access forbidden. Validate bounded endpoint against deployment proxy policy, then create a new server-generated network-proxy Secret reference with durable idempotency/audit and compensation. Endpoint/credentials are write-only. Does not connect, probe, change System settings, update an existing reference, acknowledge a runtime lease or activate any route. Caller explicitly PATCHes network settings with returned manualProxyRef and current baseVersion, then restarts affected services. Same subject/requestId plus protected canonical payload fingerprint returns original receipt; changed intent conflicts, in-progress never starts a second Secret write. See V1-手动代理秘密配置契约.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualProxyProvisionRequest' }
      responses:
        '201':
          description: Stored proxy reference or identical committed receipt replay; no route activation or connectivity claim
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualProxyProvisionReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: permission_denied/insufficient_scope/step_up_required/csrf_failed; no Secret or settings mutation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: version_conflict for changed same-ID intent or request_conflict while original operation is pending/compensating; reuse original requestId, never create another reference to bypass an uncertain result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: invalid_request/proxy_configuration_invalid/policy_blocked; no usable reference, connection, settings or route change; no endpoint/credential details echoed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/skills/custom:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1skills~1custom'
  /api/v1/skills/{skillId}/definition:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1skills~1{skillId}~1definition'
  /api/v1/skills/{skillId}/translations:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1skills~1{skillId}~1translations'
  /api/v1/skills/{skillId}/translations/apply:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1skills~1{skillId}~1translations~1apply'
  /api/v1/mcp/templates:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1mcp~1templates'
  /api/v1/mcp/{mcpId}/config:
    $ref: 'V1-extension-management.openapi.yaml#/paths/~1api~1v1~1mcp~1{mcpId}~1config'
  /api/v1/extensions/confirmations:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1extensions~1confirmations'
  /api/v1/actions/resolve:
    post:
      operationId: resolveActionCandidates
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: planned
      x-dgos-contract-status: accepted-engineering-projection
      description: Authenticated action.read projection for registered candidates only. No plan, confirmation, Run, target mutation or automatic execution. Resolver output is untrusted until registry/version/schema/permission filtering; execution remains plan then confirm then execute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionResolveRequest' }
      responses:
        '200':
          description: Authorized candidate list, empty when no unambiguous registered candidate exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResolveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/extensions/previews:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1extensions~1previews'
  /api/v1/mcp/{mcpId}/connect:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1mcp~1{mcpId}~1connect'
  /api/v1/mcp/{mcpId}/disconnect:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1mcp~1{mcpId}~1disconnect'
  /api/v1/mcp/{mcpId}/tools:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1mcp~1{mcpId}~1tools'
  /api/v1/extensions/runs:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1extensions~1runs'
  /api/v1/extensions/runs/{runId}:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1extensions~1runs~1{runId}'
  /api/v1/extensions/runs/{runId}/events:
    $ref: 'V1-extension.openapi.yaml#/paths/~1api~1v1~1extensions~1runs~1{runId}~1events'
  /api/v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Public app catalog, only verified official or administrator-approved packages
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AppPackageRecord' } } } }
    post:
      tags: [apps]
      operationId: submitAppManifest
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      description: Verify real signed package bytes; caller cannot provide source, catalogState or effective trust. Scope app.catalog.manage; authentication and CSRF apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppPackageEnvelope' }
      responses:
        '201':
          description: Verified package staged for review or trusted official catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppPackageRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Configured file-count or decoded/encoded request-size limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/apps/{appId}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: getApp
      x-tag-feature: V1-FR-002
      parameters:
        - { in: query, name: version, schema: { type: string } }
        - { in: query, name: build, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/AppPackage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/apps/{appId}/approve:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      operationId: approveApp
      x-tag-feature: V1-FR-002
      description: Administrator review of verified bytes; approval does not grant trusted/system capabilities.
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppPackage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/reject:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      operationId: rejectApp
      x-tag-feature: V1-FR-002
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppPackage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      operationId: withdrawApp
      x-tag-feature: V1-FR-002
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppPackage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/test-install:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      operationId: testInstallApp
      x-tag-feature: V1-FR-002
      description: Separate app.package.test_install permission; does not approve catalog entry.
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppInstall' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/install:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      tags: [apps]
      operationId: installApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppInstall' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/launch:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      tags: [apps]
      operationId: launchApp
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody: { $ref: '#/components/requestBodies/AppMutation' }
      responses:
        '200':
          description: Authenticated subject/session-bound isolated launch instance; declarations are not runtime grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLaunchReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/deployment:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    get:
      operationId: getAppDeployment
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: planned
      description: app.catalog.read plus authenticated subject ownership; no subjectId override. Sole deployment lookup; /apps/installations is not a public alternative. Distinct from catalog reviewVersion. Return retained uninstalled record with activeRelease=null if present, otherwise 404 without enumerating other subjects. D uses versionNumber as update/uninstall baseVersion.
      responses:
        '200':
          description: Current subject deployment and optimistic concurrency revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppDeployment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/apps/{appId}/bridge:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      operationId: invokeAppCapability
      security: [{ dgosSession: [] }]
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: planned
      description: Authenticated host Session and CSRF only; recheck session/subject/instance/app/digest, installed declarations and current broker before registered handler. Capability inputs follow V1-app-bridge.schema.json call definitions. SDK names are not HTTP scopes; use the fixed mapping in the SDK contract. No arbitrary URL/method/headers or caller identity forwarding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCapabilityRequest' }
      responses:
        '200':
          description: Selected capability-specific redacted public response
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/resources/{resourcePath}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { in: path, name: resourcePath, required: true, schema: { type: string }, description: Package-relative decoded path captured by runtime wildcard; reject traversal/symlink/absolute paths }
    get:
      operationId: readAppResource
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: planned
      security:
        - appLaunchTicket: []
        - dgosSession: []
      description: Verified static bytes for bound active package only. Ticket checks session/subject/instance/digest/expiry, never grants API access. No-store/no-referrer/nosniff and sandbox CSP required.
      responses:
        '200':
          description: Verified resource with actual media type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/apps/{appId}/update:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      tags: [apps]
      operationId: updateApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      requestBody: { $ref: '#/components/requestBodies/AppReleaseMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppInstall' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/uninstall:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    post:
      tags: [apps]
      operationId: uninstallApp
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      description: Removes registration/code pointer only, retains user data. No deleteData override is accepted.
      requestBody: { $ref: '#/components/requestBodies/AppMutation' }
      responses:
        '200': { $ref: '#/components/responses/AppInstall' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/apps/{appId}/health:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
    get:
      tags: [apps]
      operationId: checkAppHealth
      x-tag-feature: V1-FR-002
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Actual health snapshot, no state-only success assertion
          content:
            application/json:
              schema: { type: object, required: [appId, healthy], properties: { appId: { type: string }, healthy: { type: boolean }, state: { type: string }, version: { type: string }, build: { type: integer, minimum: 0 }, reasonCode: { type: string } } }
  /api/v1/actions:
    get:
      tags: [assistant]
      operationId: listActions
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Actions visible to the current subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionList' }
  /api/v1/system/settings:
    get:
      tags: [system]
      operationId: readSystemSettings
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Current system settings and effective values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettingsSnapshot' }
    patch:
      tags: [system]
      operationId: writeSystemSettings
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettingsPatch' }
      responses:
        '200':
          description: Updated settings and restart status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettingsSnapshot' }
        '409':
          description: Settings version conflict
  /api/v1/system/context:
    get:
      tags: [system]
      operationId: readSystemContext
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Redacted runtime context for the current application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemContextSnapshot' }
  /api/v1/system/context/events:
    get:
      tags: [system]
      operationId: subscribeSystemContext
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      responses:
        '200':
          description: Server-sent system context changes
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/permissions/check:
    post:
      tags: [system]
      operationId: checkPermission
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCheckRequest' }
      responses:
        '200':
          description: Effective permission decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDecisionResult' }
  /api/v1/permissions/request:
    post:
      tags: [system]
      operationId: requestPermission
      x-tag-feature: V1-FR-001
      x-tag-implementation-status: implemented-local-contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
      responses:
        '202':
          description: User confirmation request created; no side effect has occurred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDecisionResult' }
  /api/v1/actions/{actionId}/plan:
    post:
      tags: [assistant]
      operationId: planAction
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionPlanRequest' }
      responses:
        '200':
          description: Action plan and confirmation requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPlan' }
  /api/v1/actions/{actionId}/execute:
    post:
      tags: [assistant]
      operationId: executeAction
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionExecuteRequest' }
      responses:
        '202':
          description: Action execution accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
  /api/v1/action-runs/{runId}:
    get:
      tags: [assistant]
      operationId: getActionRun
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionRunId' }
      responses:
        '200':
          description: Action run snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
    delete:
      tags: [assistant]
      operationId: cancelActionRun
      x-tag-feature: V1-FR-009
      x-tag-implementation-status: implemented-local-contract
      parameters:
        - { $ref: '#/components/parameters/ActionRunId' }
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
  /api/v1/provider/protocols:
    get:
      tags: [providers]
      operationId: listProviderProtocols
      description: Authenticated provider.config.read (or existing registry read capability); returns only published adapters. Public adapterVersion maps internal protocolVersion, and schemas use stable DGOS references, never internal URLs.
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Registered protocol adapters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProtocolAdapterRegistration' }
  /api/v1/provider/configs/{providerId}/capabilities:
    get:
      tags: [providers]
      operationId: listProviderCapabilities
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '200':
          description: Versioned capability descriptor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCapabilityDescriptor' }
  /api/v1/provider/capability-protocols:
    get:
      tags: [providers]
      operationId: listCapabilityProtocols
      description: Authenticated provider.config.read; returns persisted active V1 text.chat protocol versions only. Read does not refresh models or enable policy.
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      responses:
        '200':
          description: Registered declarative capability protocols
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
    post:
      tags: [providers]
      operationId: validateCapabilityProtocol
      security: [{ dgosSession: [] }]
      description: Validation only, no publish/enable/upstream request. Requires provider.protocol.write and a fresh authorized administrator/developer session; request fields validated against the V1 text-only declaration.
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityProtocolValidationRequest' }
      responses:
        '200':
          description: Canonical validated protocol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityProtocolRegistration' }
        '422':
          description: Protocol schema or safety validation failed
  /api/v1/provider/capability-protocols/confirmations:
    post:
      tags: [providers]
      operationId: issueCapabilityProtocolConfirmation
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
      security: [{ dgosSession: [] }]
      description: Explicit review/confirm action; requires CSRF, provider.protocol.write, fresh administrator session and server-derived session ID. No API Key authentication. Issues a five-minute single-use ticket only; does not publish or change state. Same subject/requestId and identical session/operation/protocolId/version/payload digest return the original ticket without extending expiry; changed binding conflicts. Publication/state must reuse this requestId. Client echoes server validationDigest and never computes or supplies identity/digest for state changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityProtocolConfirmationRequest' }
      responses:
        '201':
          description: Issued or identically replayed ticket; no declaration/state mutation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityProtocolConfirmationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/provider/capability-protocols/{protocolId}/versions:
    parameters:
      - { in: path, name: protocolId, required: true, schema: { type: string } }
    post:
      operationId: registerCapabilityProtocolVersion
      security: [{ dgosSession: [] }]
      x-tag-feature: V1-FR-007
      x-tag-implementation-status: planned
